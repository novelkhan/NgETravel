<div class="container">
  <h1 class="mt-3">Edit Package</h1>

  <ng-container *ngIf="package; else notFound">
    <form #form="ngForm" (ngSubmit)="onSubmit()">
      <!-- Package Details -->
      <div class="mt-3">
        <label class="form-label" for="packageName">Package Name</label>
        <input
          type="text"
          id="packageName"
          class="form-control"
          name="packageName"
          [(ngModel)]="package.packageName"
          placeholder="Enter package name"
          required
        />
      </div>

      <div class="mt-3">
        <label class="form-label" for="destination">Destination</label>
        <input
          type="text"
          id="destination"
          class="form-control"
          name="destination"
          [(ngModel)]="package.destination"
          placeholder="Enter destination"
          required
        />
      </div>

      <div class="mt-3">
        <label class="form-label" for="price">Price</label>
        <input
          type="text"
          id="price"
          class="form-control"
          name="price"
          [(ngModel)]="package.price"
          placeholder="Enter price"
          required
        />
      </div>

      <div class="mt-3">
        <label class="form-label" for="description">Description</label>
        <textarea
          id="description"
          class="form-control"
          name="description"
          [(ngModel)]="package.packageData.description"
          placeholder="Enter package description"
          rows="3"
        ></textarea>
      </div>

      <div class="mt-3">
        <label class="form-label" for="viaDestination">Via Destination</label>
        <input
          type="text"
          id="viaDestination"
          class="form-control"
          name="viaDestination"
          [(ngModel)]="package.packageData.viaDestination"
          placeholder="Enter via destination"
        />
      </div>

      <div class="mt-3">
        <label class="form-label" for="date">Date</label>
        <input
          type="date"
          id="date"
          class="form-control"
          name="date"
          [(ngModel)]="package.packageData.date"
        />
      </div>

      <div class="mt-3">
        <label class="form-label" for="availableSeat">Available Seats</label>
        <input
          type="number"
          id="availableSeat"
          class="form-control"
          name="availableSeat"
          [(ngModel)]="package.packageData.availableSeat"
          placeholder="Enter available seats"
        />
      </div>

      <!-- Image Management -->
      <h3 class="mt-4">Images</h3>
      <div *ngFor="let image of package.packageData?.packageImages; let i = index" class="mb-3">
        <div class="d-flex align-items-center">
          <!-- Display preview if URL exists -->
          <img *ngIf="image.url" [src]="image.url" alt="Image Preview" width="100" height="100" class="me-3" />
          <!-- File input for each image slot -->
          <input type="file" (change)="onFileSelected($event, i)" />
          <!-- Remove image button -->
          <button type="button" (click)="removeImage(i)" class="btn btn-danger ms-3">Remove</button>
        </div>
      </div>
      <!-- Button to add a new image slot -->
      <button type="button" class="btn btn-secondary" (click)="addNewImageSlot()">Add New Image</button>


      <!-- Submit Buttons -->
      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a [routerLink]="['/packages']" class="btn btn-secondary ms-2">Cancel</a>
      </div>
    </form>
  </ng-container>

  <ng-template #notFound>
    <div class="alert alert-warning" role="alert">
      Package not found!
    </div>
  </ng-template>
</div>
