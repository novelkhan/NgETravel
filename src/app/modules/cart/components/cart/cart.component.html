<div class="container my-5">
  <h2 class="mb-4">Shopping Cart</h2>
  <div class="row">
    <div class="col-md-8">
      <div *ngFor="let item of cartItems" class="card mb-3 shadow">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center">
            <input
              type="checkbox"
              [checked]="isSelected(item)"
              (change)="toggleSelection(item, $event)"
              class="form-check-input me-2"
            />
            <img [src]="'data:image/jpeg;base64,' + item.productImageSRC" alt="Product" class="rounded me-3" width="80" />
            <div>
              <h5 class="mb-1">{{ item.productName }}</h5>
              <p class="text-muted mb-0">Price: ${{ item.productPrice }}</p>
            </div>
          </div>
          <div class="d-flex align-items-center">
            <button class="btn btn-outline-secondary btn-sm me-2" (click)="decreaseQuantity(item.cartItemId)">-</button>
            <span class="mx-2">{{ item.productQuantity }}</span>
            <button class="btn btn-outline-secondary btn-sm me-3" (click)="increaseQuantity(item.cartItemId)">+</button>
            <button class="btn btn-danger btn-sm" (click)="removeItemFromCart(item.cartItemId)">Remove</button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h5 class="card-title">Order Summary</h5>
          <p>
            Total Items:
            <strong>{{ getTotalItems() }}</strong>
          </p>
          <p>
            Total Price:
            <strong>${{ getTotalPrice() }}</strong>
          </p>
          <button class="btn btn-primary w-100" [disabled]="cartItems.length === 0" (click)="proceedToCheckout()">
            Proceed to Checkout
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
