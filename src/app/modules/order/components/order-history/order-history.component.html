<div class="container py-4">
  <h2 class="text-center mb-4">Order History</h2>
  <div *ngIf="orders.length === 0" class="text-center text-muted">
    <p>No orders found.</p>
  </div>
  <div *ngFor="let order of orders" class="card mb-3 shadow">
    <div class="card-body">
      <div class="order-header mb-3">
        <h3 class="card-title">Order ID: {{ order.orderId }}</h3>
        <p class="card-text mb-1">Order Date: {{ formatDate(order.orderDate) }}</p>
        <p class="card-text mb-1">Total Amount: ${{ order.totalAmount }}</p>
        <p class="card-text">Status: {{ order.isShipped ? 'Shipped' : 'Processing' }}</p>
      </div>
      <div class="order-items">
        <h4 class="h5 mb-3">Items:</h4>
        <div *ngFor="let item of order.orderItems" class="d-flex align-items-center mb-3">
          <img
            *ngIf="item.productImage"
            [src]="'data:image/jpeg;base64,' + item.productImage"
            [alt]="item.productName"
            class="img-fluid rounded me-3"
            style="width: 100px; height: 100px; object-fit: contain; background-color: #f0f0f0;"
          />
          <p class="mb-0">{{ item.productName }} (x{{ item.quantity }}) - ${{ item.totalPrice }}</p>
        </div>
      </div>
      <button class="btn btn-primary mt-3" (click)="navigateToOrderDetails(order.orderId)">
        Order Details
      </button>
    </div>
  </div>
</div>
